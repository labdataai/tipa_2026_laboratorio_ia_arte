<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ecosistema de bichos</title>
<style>body{margin:0;padding:16px;background:#0d1009}</style>
</head><body>
<div id="eco-root">
<style>
#eco-root{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#e8eadf;background:#000;border-radius:10px;overflow:hidden;box-sizing:border-box}
#eco-root *{box-sizing:border-box}
#eco-root .eco-stage{position:relative;overflow:hidden;background:#000}
#eco-root .eco-stage.idle{cursor:none}
#eco-root #eco-canvas{width:100%;height:auto;display:block;background:#2f4a1f}
#eco-root .eco-stage:fullscreen{display:flex;align-items:center;justify-content:center}
#eco-root .eco-stage:fullscreen #eco-canvas{width:100%;height:100%;object-fit:contain}
#eco-root .eco-stage:-webkit-full-screen{display:flex;align-items:center;justify-content:center}
#eco-root .eco-stage:-webkit-full-screen #eco-canvas{width:100%;height:100%;object-fit:contain}
#eco-root .eco-big{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:40px;font-weight:700;color:#fff;text-shadow:0 2px 14px #000;pointer-events:none;padding:20px}
#eco-root .eco-toast{position:absolute;left:14px;bottom:14px;max-width:min(520px,70%);background:rgba(12,16,9,.82);color:#e8eadf;font-size:13px;line-height:1.35;padding:8px 12px;border-radius:8px;pointer-events:none;opacity:0;transition:opacity .4s}
#eco-root .eco-toast.show{opacity:1}
#eco-root .eco-gear{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(12,16,9,.65);color:#fff;font-size:20px;line-height:1;cursor:pointer;opacity:1;transition:opacity .5s}
#eco-root .eco-stage.idle .eco-gear,#eco-root .eco-stage.menu .eco-gear{opacity:0;pointer-events:none}
#eco-root .eco-drawer{position:absolute;top:0;right:0;bottom:0;width:min(370px,94%);background:rgba(20,25,15,.95);border-left:1px solid #3a4630;transform:translateX(105%);transition:transform .3s ease;display:flex;flex-direction:column;z-index:2}
#eco-root .eco-stage.menu .eco-drawer{transform:none}
#eco-root .eco-dhead{display:flex;align-items:center;gap:8px;padding:10px 12px 6px}
#eco-root .eco-dhead b{flex:1;font-size:14px}
#eco-root .eco-x{background:none;border:0;color:#cfd8bf;font-size:22px;cursor:pointer;padding:0 4px}
#eco-root .eco-scroll{overflow-y:auto;padding:0 12px 14px;flex:1}
#eco-root .eco-preview{width:100%;border-radius:8px;display:block;background:#000}
#eco-root .eco-preview.picking{cursor:crosshair;outline:2px solid #f2c94c}
#eco-root .eco-status{font-size:12px;color:#a9b78f;margin:6px 0 8px;line-height:1.35}
#eco-root .eco-tabs{display:flex;gap:4px;margin:6px 0 10px;position:sticky;top:0;background:rgba(20,25,15,.98);padding:4px 0;z-index:1}
#eco-root .eco-tabs button{flex:1}
#eco-root .eco-tabs button.on{background:#4a5c2e;border-color:#6b8344}
#eco-root .eco-sec{display:none}
#eco-root .eco-sec.on{display:block}
#eco-root h3{margin:12px 0 6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#a9b78f;font-weight:600;display:flex;justify-content:space-between}
#eco-root h3 span{color:#e8eadf;letter-spacing:0;text-transform:none;font-weight:500}
#eco-root .eco-person{display:grid;grid-template-columns:14px 1fr;gap:4px 8px;align-items:center;font-size:12px;padding:6px 0;border-top:1px solid #2c3522}
#eco-root .eco-person:first-child{border-top:0}
#eco-root .eco-sw{width:12px;height:12px;border-radius:3px;border:1px solid #0008;display:inline-block}
#eco-root .eco-speed{grid-column:2;position:relative;height:6px;background:#2c3522;border-radius:3px}
#eco-root .eco-speed>i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,#7fbf5a,#f2c94c,#eb5a3c)}
#eco-root .eco-speed>b{position:absolute;top:-2px;bottom:-2px;width:2px;background:#e8eadf;opacity:.7}
#eco-root .eco-empty,#eco-root .eco-sub{font-size:11.5px;color:#8d9a77}
#eco-root .eco-slider{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:12px;margin:7px 0}
#eco-root .eco-slider input{grid-column:1/3;width:100%;accent-color:#9fd45f}
#eco-root .eco-slider output{color:#c8d2b4;font-variant-numeric:tabular-nums}
#eco-root .eco-slider.off{opacity:.4}
#eco-root .eco-check{display:flex;gap:8px;align-items:center;font-size:12.5px;margin:7px 0}
#eco-root .eco-check input{accent-color:#9fd45f}
#eco-root button{font:inherit;font-size:12px;background:#2c3522;color:#e8eadf;border:1px solid #3d4a2f;border-radius:7px;padding:6px 8px;cursor:pointer}
#eco-root button:hover{background:#3a4630}
#eco-root .eco-btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#eco-root .eco-row{border:1px solid #2f3a25;border-radius:9px;padding:8px;margin:8px 0;background:#1a2013}
#eco-root .eco-row.on{border-color:#9fd45f;box-shadow:0 0 0 1px #9fd45f inset}
#eco-root .eco-rh{display:flex;gap:6px;align-items:center}
#eco-root .eco-rh input[type=color]{width:34px;height:28px;padding:0;border:1px solid #3d4a2f;border-radius:6px;background:none;cursor:pointer}
#eco-root .eco-rh input[type=text]{flex:1;min-width:0;font:inherit;font-size:13px;background:#11160d;color:#e8eadf;border:1px solid #3d4a2f;border-radius:6px;padding:5px 7px}
#eco-root .eco-rh button{padding:5px 7px}
#eco-root .eco-rh button.armed{background:#7a6a1f;border-color:#f2c94c}
#eco-root .eco-sel3{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-items:center;margin-top:7px;font-size:12px}
#eco-root .eco-sel3 select{font:inherit;font-size:12px;background:#11160d;color:#e8eadf;border:1px solid #3d4a2f;border-radius:6px;padding:4px;width:100%}
#eco-root .eco-sel3 select.on{border-color:#9fd45f;color:#fff}
#eco-root .eco-camsel{display:flex;gap:8px;align-items:center;font-size:12px;margin:0 0 8px}
#eco-root .eco-camsel select{flex:1;min-width:0;font:inherit;font-size:12px;background:#11160d;color:#e8eadf;border:1px solid #3d4a2f;border-radius:6px;padding:5px}
#eco-root .eco-saved{font-size:11.5px;color:#8d9a77;margin-top:6px;min-height:1.2em}
</style>
<div class="eco-stage" id="eco-stage">
  <canvas id="eco-canvas" width="960" height="600"></canvas>
  <div class="eco-big" id="eco-big"></div>
  <div class="eco-toast" id="eco-toast"></div>
  <button class="eco-gear" id="eco-gear" title="Menú (tecla M)">⚙</button>
  <aside class="eco-drawer" id="eco-drawer">
    <div class="eco-dhead"><b>Ecosistema · <span id="eco-mode"></span></b><button class="eco-x" id="eco-close" title="Ocultar menú (M)">×</button></div>
    <div class="eco-scroll">
      <label class="eco-camsel" id="eco-camsel">📹 Cámara <select id="eco-cam"><option>Buscando cámaras…</option></select></label>
      <canvas class="eco-preview" id="eco-preview" width="256" height="192"></canvas>
      <div class="eco-status" id="eco-status">Pidiendo permiso para usar la cámara…</div>
      <div class="eco-tabs"><button data-tab="col" class="on">Colores y bichos</button><button data-tab="det">Detección</button><button data-tab="esc">Escena</button></div>

      <section class="eco-sec on" data-sec="col">
        <div class="eco-sub">Cada color de ropa elige un bicho según la velocidad. Usá 📷 y hacé clic sobre la ropa en la vista de cámara para tomar el tono exacto.</div>
        <div id="eco-sliders-col"></div>
        <div id="eco-editor"></div>
        <div class="eco-btns">
          <button id="eco-add">+ Agregar color</button>
          <button id="eco-reset">Restaurar valores</button>
          <button id="eco-dl">Descargar configuración</button>
          <button id="eco-ul">Cargar configuración</button>
          <input type="file" id="eco-file" accept=".json,application/json" hidden>
        </div>
        <div class="eco-saved" id="eco-saved"></div>
      </section>

      <section class="eco-sec" data-sec="det">
        <h3>Personas → bichos <span id="eco-count">0</span></h3>
        <div id="eco-people"><div class="eco-empty">Nadie en cuadro todavía.</div></div>
        <h3>Sensibilidad</h3>
        <div id="eco-sliders-det"></div>
        <div class="eco-btns">
          <button id="eco-btn-mode">Cambiar detector</button>
          <button id="eco-btn-cal" title="Salí del cuadro: se guarda el fondo vacío">Calibrar fondo</button>
          <button id="eco-btn-demo">Modo demo</button>
        </div>
      </section>

      <section class="eco-sec" data-sec="esc">
        <div id="eco-sliders-esc"></div>
        <label class="eco-check"><input type="checkbox" id="eco-chk-names"> Mostrar el nombre de cada bicho</label>
        <label class="eco-check"><input type="checkbox" id="eco-chk-shadow"> Mostrar la silueta de las personas (detector por fondo)</label>
        <label class="eco-check"><input type="checkbox" id="eco-chk-night"> Noche automática al apagar la luz</label>
        <label class="eco-check"><input type="checkbox" id="eco-chk-mirror"> Espejar la imagen (como un espejo: tu derecha queda a la derecha)</label>
        <div class="eco-btns">
          <button id="eco-btn-night">Forzar noche</button>
          <button id="eco-btn-full">Pantalla completa</button>
        </div>
      </section>
    </div>
  </aside>
</div>
</div>
<script>
(function(){
'use strict';
const CFG = Object.assign({
  detector: 'ia', proporcion: '16:10', max_personas: 6, confianza: 0.5, altura_min: 0.15, umbral_fondo: 70,
  sensibilidad: 5, umbral_mov: 22, lim_medio: 0.25, lim_rapido: 0.6, estabilidad: 0.8, tolerancia: 40,
  tamano: 1.0, flores: 0, escala_pasto: 1.0, espejo: true, excluir_piel: true, mostrar_sombra: true, noche: true,
  mostrar_nombres: true, registrar: false, guardado: null, colab: false, camara: ''
}, {"detector": "ia", "proporcion": "16:10", "camara": "", "max_personas": 6, "tolerancia": 40, "escala_pasto": 1.0, "flores": 0, "confianza": 0.5, "altura_min": 0.15, "umbral_fondo": 70, "sensibilidad": 5.0, "umbral_mov": 22, "lim_medio": 0.25, "lim_rapido": 0.6, "estabilidad": 0.8, "tamano": 1.0, "espejo": true, "excluir_piel": true, "mostrar_nombres": true, "mostrar_sombra": true, "noche": true, "registrar": false, "guardado": null, "colab": false});

const $ = id => document.getElementById(id);
const stage = $('eco-stage'), cv = $('eco-canvas');
const SIZES = { '16:10': [960, 600], '16:9': [1066, 600], '4:3': [800, 600], 'ancha': [1560, 600] };
[cv.width, cv.height] = SIZES[CFG.proporcion] || SIZES['16:10'];
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const pv = $('eco-preview'), pctx = pv.getContext('2d');
const statusEl = $('eco-status'), bigEl = $('eco-big'), toastEl = $('eco-toast');
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, k) => a + (b - a) * k;
const pick = arr => arr[(Math.random() * arr.length) | 0];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ==================================================================
   ESPECIES  (d = cómo se dibuja, k = factor de tamaño, fly = vuela)
   ================================================================== */
const SPECIES = {
  larva_vaquita:     { n: 'Larva de vaquita',       d: 'gusano', k: 0.42, p: { c1: '#3a3a46', c2: '#2c2c36', head: '#17171d', dot: '#f07a2a' } },
  vaquita:           { n: 'Vaquita de San Antonio', d: 'vaquita', k: 0.9, p: { shell: '#d8262b' }, spots: true },
  vaquita_vuela:     { n: 'Vaquita volando',        d: 'vaquita', k: 0.9, p: { shell: '#d8262b' }, spots: true, fly: true },
  oruga_naranja:     { n: 'Oruga naranja',          d: 'gusano', k: 0.45, p: { c1: '#f7a447', c2: '#e8862c', head: '#6e3410', dot: '#2b1a0e' } },
  hormiga_colorada:  { n: 'Hormiga colorada',       d: 'hormiga', k: 0.62, p: { body: '#b5481e' } },
  monarca:           { n: 'Mariposa monarca',       d: 'mariposa', k: 0.85, p: { w1: '#f08a24', w2: '#e57a14', edge: '#2b1a0e', dot: '#fff' }, fly: true },
  oruga_amarilla:    { n: 'Oruga amarilla',         d: 'gusano', k: 0.45, p: { c1: '#f5d84a', c2: '#2b2b2b', head: '#2b2b2b', dot: null } },
  escarabajo_dorado: { n: 'Escarabajo dorado',      d: 'vaquita', k: 0.95, p: { shell: '#d9a520' } },
  abeja:             { n: 'Abeja',                  d: 'abeja', k: 0.85, fly: true },
  oruga_verde:       { n: 'Oruga verde',            d: 'gusano', k: 0.45, p: { c1: '#b8ec6a', c2: '#9adb4c', head: '#4f8f25', dot: '#2f5a17' } },
  saltamontes:       { n: 'Saltamontes',            d: 'saltamontes', k: 0.85, p: { body: '#8fd14f', leg: '#5f9c32' } },
  libelula_verde:    { n: 'Libélula verde',         d: 'libelula', k: 0.8, p: { body: '#5fd07a', eye: '#1f6a33' }, fly: true },
  caracol_azul:      { n: 'Caracol azul',           d: 'caracol', k: 0.85, p: { shell: '#3a6fc4', line: '#1f3f7a', foot: '#c9d3e0' } },
  escarabajo_azul:   { n: 'Escarabajo azul',        d: 'vaquita', k: 0.95, p: { shell: '#2f5fb8' } },
  libelula_azul:     { n: 'Libélula azul',          d: 'libelula', k: 0.8, p: { body: '#2f7fd9', eye: '#163d6e' }, fly: true },
  lombriz:           { n: 'Lombriz',                d: 'gusano', k: 0.36, p: { c1: '#e79aa2', c2: '#df8b95', head: '#e8a0a8', band: '#c4707c', dot: null } },
  saltamontes_rosa:  { n: 'Saltamontes rosa',       d: 'saltamontes', k: 0.85, p: { body: '#e07ab8', leg: '#b65a92' } },
  mariposa_violeta:  { n: 'Mariposa violeta',       d: 'mariposa', k: 0.85, p: { w1: '#9b6fd6', w2: '#7f55c0', edge: '#2a1a40', dot: '#f2e6ff' }, fly: true },
  caracol:           { n: 'Caracol',                d: 'caracol', k: 0.85, p: { shell: '#8a5a2b', line: '#5e3b18', foot: '#cdb48a' } },
  grillo:            { n: 'Grillo',                 d: 'saltamontes', k: 0.85, p: { body: '#6e4a2a', leg: '#4e331c' } },
  polilla:           { n: 'Polilla',                d: 'mariposa', k: 0.85, p: { w1: '#a88a66', w2: '#8f7352', edge: '#5a4630', dot: '#d9c7a8' }, fly: true },
  bicho_bolita:      { n: 'Bicho bolita',           d: 'bolita', k: 0.75, p: { body: '#5a5a64', line: '#2c2c33' } },
  hormiga:           { n: 'Hormiga negra',          d: 'hormiga', k: 0.62, p: { body: '#1b120c' } },
  hormiga_alada:     { n: 'Hormiga alada',          d: 'hormiga', k: 0.62, p: { body: '#1b120c' }, fly: true },
  gusano_blanco:     { n: 'Gusano blanco',          d: 'gusano', k: 0.45, p: { c1: '#f3efe4', c2: '#e3dccb', head: '#c9852a', dot: null } },
  polilla_blanca:    { n: 'Polilla blanca',         d: 'mariposa', k: 0.8, p: { w1: '#f4f1e8', w2: '#e3dfd2', edge: '#b8b2a2', dot: '#cfc8b6' }, rest: true },
  luciernaga:        { n: 'Luciérnaga',             d: 'luciernaga', k: 0.75, fly: true }
};
const GRUPO = k => { const s = SPECIES[k]; return s.fly ? 'Vuelan' : (s.d === 'gusano' || s.d === 'caracol') ? 'Se arrastran' : 'Caminan'; };
const NIVELES = ['lento', 'medio', 'rápido'];
const NIVEL_ICON = ['🐌 Lento', '🚶 Medio', '🏃 Rápido'];

/* ==================================================================
   CONFIGURACIÓN EDITABLE: paleta de colores de ropa → 3 bichos
   ================================================================== */
const DEFAULT_PAL = [
  { nombre: 'Rojo',         color: '#c0282d', e: ['larva_vaquita', 'vaquita', 'vaquita_vuela'] },
  { nombre: 'Naranja',      color: '#e8782a', e: ['oruga_naranja', 'hormiga_colorada', 'monarca'] },
  { nombre: 'Amarillo',     color: '#e6c430', e: ['oruga_amarilla', 'escarabajo_dorado', 'abeja'] },
  { nombre: 'Verde',        color: '#3f9a4a', e: ['oruga_verde', 'saltamontes', 'libelula_verde'] },
  { nombre: 'Azul',         color: '#2f5fb0', e: ['caracol_azul', 'escarabajo_azul', 'libelula_azul'] },
  { nombre: 'Rosa/violeta', color: '#c0509a', e: ['lombriz', 'saltamontes_rosa', 'mariposa_violeta'] },
  { nombre: 'Marrón',       color: '#7a4e2c', e: ['caracol', 'grillo', 'polilla'] },
  { nombre: 'Negro',        color: '#222226', e: ['bicho_bolita', 'hormiga', 'hormiga_alada'] },
  { nombre: 'Blanco/gris',  color: '#e8e8e4', e: ['gusano_blanco', 'polilla_blanca', 'luciernaga'] }
];
const clone = o => JSON.parse(JSON.stringify(o));
function validPal(p) {
  if (!Array.isArray(p) || !p.length) return null;
  const out = [];
  for (const r of p.slice(0, 20)) {
    if (!r || !/^#[0-9a-f]{6}$/i.test(r.color || '') || !Array.isArray(r.e) || r.e.length !== 3) continue;
    out.push({ nombre: String(r.nombre || 'Color').slice(0, 30), color: r.color.toLowerCase(), e: r.e.map(k => SPECIES[k] ? k : 'hormiga') });
  }
  return out.length ? out : null;
}

/* Parámetros en vivo (sliders) */
const P = {};
const SLIDERS = [
  { id: 'tolerancia',   g: 'col', label: 'Tolerancia de color',            min: 10, max: 90, step: 1, fmt: v => v },
  { id: 'confianza',    g: 'det', label: 'Confianza mínima (IA)',          min: 0.2, max: 0.9, step: 0.05, fmt: v => Math.round(v * 100) + '%', only: 'ia' },
  { id: 'umbral_fondo', g: 'det', label: 'Diferencia con el fondo',        min: 20, max: 200, step: 5, fmt: v => v, only: 'fondo' },
  { id: 'altura_min',   g: 'det', label: 'Tamaño mínimo de persona',       min: 0.05, max: 0.6, step: 0.01, fmt: v => Math.round(v * 100) + '% alto' },
  { id: 'max_personas', g: 'det', label: 'Máximo de personas',             min: 1, max: 12, step: 1, fmt: v => v },
  { id: 'sensibilidad', g: 'det', label: 'Sensibilidad a la velocidad',    min: 1, max: 10, step: 0.5, fmt: v => v },
  { id: 'umbral_mov',   g: 'det', label: 'Umbral de movimiento (brillo)',  min: 6, max: 60, step: 1, fmt: v => v },
  { id: 'lim_medio',    g: 'det', label: 'Límite lento → medio',           min: 0.05, max: 0.9, step: 0.01, fmt: v => v.toFixed(2) },
  { id: 'lim_rapido',   g: 'det', label: 'Límite medio → rápido',          min: 0.1, max: 1, step: 0.01, fmt: v => v.toFixed(2) },
  { id: 'estabilidad',  g: 'det', label: 'Tiempo para metamorfosis',       min: 0.2, max: 3, step: 0.1, fmt: v => v.toFixed(1) + ' s' },
  { id: 'tamano',       g: 'esc', label: 'Tamaño de los bichos',           min: 0.5, max: 2.5, step: 0.1, fmt: v => v.toFixed(1) + '×' },
  { id: 'escala_pasto', g: 'esc', label: 'Escala del pasto',               min: 0.4, max: 2.5, step: 0.1, fmt: v => v.toFixed(1) + '×' },
  { id: 'flores',       g: 'esc', label: 'Flores',                         min: 0, max: 30, step: 1, fmt: v => v }
];
const FLAGS = ['mostrar_nombres', 'mostrar_sombra', 'noche', 'espejo'];

/* Valores iniciales: guardado en Colab > guardado en este navegador > notebook / por defecto */
let saved = CFG.guardado;
if (!saved) { try { saved = JSON.parse(localStorage.getItem('eco-config-v1') || 'null'); } catch (e) { saved = null; } }
let PAL = (saved && validPal(saved.paleta)) || clone(DEFAULT_PAL);
SLIDERS.forEach(sd => { P[sd.id] = +CFG[sd.id]; });
FLAGS.forEach(f => { P[f] = !!CFG[f]; });
if (saved && saved.parametros) {
  for (const sd of SLIDERS) { const v = +saved.parametros[sd.id]; if (isFinite(v)) P[sd.id] = clamp(v, sd.min, sd.max); }
  for (const f of FLAGS) if (typeof saved.parametros[f] === 'boolean') P[f] = saved.parametros[f];

/* ==================================================================
   CLASIFICACIÓN DE COLOR: el color de la paleta más cercano (en Lab)
   ================================================================== */
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }

}
const LUT_LAB = new Float32Array(32768 * 3);
for (let r = 0; r < 32; r++) for (let g = 0; g < 32; g++) for (let b = 0; b < 32; b++) {
  const i = (r << 10) | (g << 5) | b, l = rgbToLab(r * 8 + 4, g * 8 + 4, b * 8 + 4);
  LUT_LAB[i * 3] = l[0]; LUT_LAB[i * 3 + 1] = l[1]; LUT_LAB[i * 3 + 2] = l[2];
}
const LUT = new Uint8Array(32768);
function buildLUT() {

  for (let i = 0; i < 32768; i++) {

}

  return r > 95 && g > 40 && b > 20 && r > g && g > b && (r - g) > 15 && (mx - mn) > 15 && s > 0.1 && s < 0.7;

function analyze() {
  actx.save();
  if (P.espejo) { actx.translate(AW, 0); actx.scale(-1, 1); }
  actx.drawImage(video, 0, 0, AW, AH);
  actx.restore();
  pix = actx.getImageData(0, 0, AW, AH).data;
  let lumSum = 0;
  for (let i = 0, p = 0; i < AW * AH; i++, p += 4) {
    const r = pix[p], g = pix[p + 1], b = pix[p + 2];

    prevLum[i] = lum;
    if (calibrating) { bgAccum[i * 3] += r; bgAccum[i * 3 + 1] += g; bgAccum[i * 3 + 2] += b; }
    let f = 0;
    if (bgModel) {

  }

    for (let i = 0; i < bgModel.length; i++) bgModel[i] = bgAccum[i] / bgFrames;

  }
  sctx.putImageData(shadowImg, 0, 0);

}

/* --- Detector 2: sustracción de fondo + manchas conectadas --- */

    let v = 0;

      const xx = x + dx, yy = y + dy;

    stack.push(s); blab[s] = n;

      if (x > 0 && bdil[k - 1] && !blab[k - 1]) { blab[k - 1] = n; stack.push(k - 1); }
      if (x < BW - 1 && bdil[k + 1] && !blab[k + 1]) { blab[k + 1] = n; stack.push(k + 1); }
      if (y > 0 && bdil[k - BW] && !blab[k - BW]) { blab[k - BW] = n; stack.push(k - BW); }

/* ==================================================================
   SEGUIMIENTO: una persona = una pista = un bicho
   ================================================================== */
let tracks = []; let nextId = 1;
let demoTrack = null;

function newTrack(d) {
  const t = {
    id: nextId++, box: { x: d.x, y: d.y, w: d.w, h: d.h }, cx: d.x + d.w / 2, cy: d.y + d.h / 2,
    missing: 0, age: 0, vel: 0, motion: 0, speed: 0, level: 0,
    shares: new Float32Array(PAL.length), colorIdx: -1, species: null, pending: null, pendingT: 0

  t.avatar = new Avatar(t);
  return t;
}

let lastAssoc = 0;
function associate(dets) {
  const nowA = performance.now(); const dt = lastAssoc ? Math.min(0.5, (nowA - lastAssoc) / 1000) : 0.05; lastAssoc = nowA;
  dets = dets.filter(d => d.h >= P.altura_min);
  const pairs = [];
  tracks.forEach((t, ti) => dets.forEach((d, di) => {
    const dist = Math.hypot(d.x + d.w / 2 - t.cx, d.y + d.h / 2 - t.cy);
    if (dist < 0.22 + Math.min(0.2, t.missing * 0.25)) pairs.push([dist, ti, di]);
  }));
  pairs.sort((a, b) => a[0] - b[0]);
  const usedT = new Set(), usedD = new Set();
  for (const [, ti, di] of pairs) {
    if (usedT.has(ti) || usedD.has(di)) continue;
    usedT.add(ti); usedD.add(di);
    const t = tracks[ti], d = dets[di];
    const ncx = d.x + d.w / 2, ncy = d.y + d.h / 2;
    const v = Math.hypot(ncx - t.cx, ncy - t.cy) / Math.max(dt, 0.016) / Math.max(t.box.h, 0.2);
    t.vel = lerp(t.vel, Math.min(v, 4), 0.3);
    for (const k of ['x', 'y', 'w', 'h']) t.box[k] = lerp(t.box[k], d[k], 0.55);
    t.cx = t.box.x + t.box.w / 2; t.cy = t.box.y + t.box.h / 2; t.missing = 0;
  }
  tracks.forEach((t, ti) => { if (!usedT.has(ti)) { t.missing += dt; t.vel *= 0.8; } });
  const active = () => tracks.filter(t => !t.avatar.leaving).length;
  dets.forEach((d, di) => { if (!usedD.has(di) && active() < P.max_personas) tracks.push(newTrack(d)); });
  for (const t of tracks) if (t.missing > 1.0 && !t.avatar.leaving) t.avatar.leaving = true;
  let extra = active() - P.max_personas;
  for (let i = tracks.length - 1; i >= 0 && extra > 0; i--) if (!tracks[i].avatar.leaving) { tracks[i].avatar.leaving = true; extra--; }
}

const tmpCounts = new Float32Array(20);
function measure(t, dt) {
  t.age += dt;
  const NC = PAL.length;
  if (pix && !t.demo) {
    const bx0 = clamp(Math.floor((t.box.x + t.box.w * 0.25) * AW), 0, AW - 1);
    const bx1 = clamp(Math.ceil((t.box.x + t.box.w * 0.75) * AW), 1, AW);
    const by0 = clamp(Math.floor((t.box.y + t.box.h * 0.22) * AH), 0, AH - 1);
    const by1 = clamp(Math.ceil((t.box.y + t.box.h * 0.62) * AH), 1, AH);
    tmpCounts.fill(0); let tot = 0;
    for (let y = by0; y < by1; y++) for (let x = bx0; x < bx1; x++) {
      const i = y * AW + x; if (mode === 'fondo' && !fgMap[i]) continue;
      const p = i * 4, r = pix[p], g = pix[p + 1], b = pix[p + 2];
      if (CFG.excluir_piel && isSkin(r, g, b)) continue;
      const c = classify(r, g, b); if (c === 255) continue;
      tmpCounts[c]++; tot++;
    }
    if (tot > 15) for (let c = 0; c < NC; c++) t.shares[c] = lerp(t.shares[c], tmpCounts[c] / tot, 0.12);
    const fx0 = clamp(Math.floor(t.box.x * AW), 0, AW - 1), fx1 = clamp(Math.ceil((t.box.x + t.box.w) * AW), 1, AW);
    const fy0 = clamp(Math.floor(t.box.y * AH), 0, AH - 1), fy1 = clamp(Math.ceil((t.box.y + t.box.h) * AH), 1, AH);
    let mv = 0, all = 0;
    for (let y = fy0; y < fy1; y++) for (let x = fx0; x < fx1; x++) { mv += moveMap[y * AW + x]; all++; }
    t.motion = lerp(t.motion, all ? mv / all : 0, 0.3);
  }
  const raw = t.demo ? t.demoSpeed : clamp((t.motion * 2.2 + t.vel * 0.35) * P.sensibilidad / 5, 0, 1);
  t.speed = lerp(t.speed, raw, raw > t.speed ? 0.18 : 0.08);
  const m = 0.03;
  if (t.level === 0 && t.speed > P.lim_medio + m) t.level = 1;
  if (t.level === 1 && t.speed > P.lim_rapido + m) t.level = 2;
  if (t.level === 2 && t.speed < P.lim_rapido - m) t.level = 1;
  if (t.level === 1 && t.speed < P.lim_medio - m) t.level = 0;
  if (t.level === 2 && t.speed < P.lim_medio - m) t.level = 0;
  let best = -1, bv = 0;
  if (t.demo) best = t.demoColor % NC;
  else for (let c = 0; c < NC; c++) if (t.shares[c] > bv) { bv = t.shares[c]; best = c; }
  if (best >= 0 && (t.demo || bv > 0.05)) t.colorIdx = best;
  if (t.colorIdx < 0 || t.colorIdx >= NC) return;
  const want = PAL[t.colorIdx].e[t.level];
  if (!t.species) { t.species = want; t.avatar.birth(want); return; }
  if (want === t.species) { t.pending = null; t.pendingT = 0; return; }
  if (want !== t.pending) { t.pending = want; t.pendingT = 0; }
  t.pendingT += dt;
  if (t.pendingT >= P.estabilidad && !t.avatar.morph) {
    t.avatar.metamorphose(t.species, want); t.species = want; t.pending = null; t.pendingT = 0;
  }
}
function paletteChanged() {
  buildLUT();
  for (const t of tracks) { t.shares = new Float32Array(PAL.length); if (!t.demo) t.colorIdx = -1; else t.colorIdx = t.demoColor % PAL.length; }
  scheduleSave();
}

/* ==================================================================
   BICHO-AVATAR
   ================================================================== */
const MORPH = 1.3;
class Avatar {
  constructor(track) {
    this.track = track; this.x = W / 2; this.y = H / 2; this.a = -Math.PI / 2; this.s = 30;
    this.alpha = 0; this.leaving = false; this.t = rand(0, 10); this.walk = 0; this.spd = 0;
    this.species = null; this.morph = null; this.segs = []; this.sparks = []; this.placed = false;
  }
  place() { const t = this.track; this.x = (t.box.x + t.box.w / 2) * W; this.y = clamp((t.box.y + t.box.h * 0.55) * H, 30, H - 30); this.placed = true; this.initSegs(); }
  birth(sp) { if (!this.placed) this.place(); this.species = sp; this.morph = { from: null, to: sp, t: 0 }; this.burst(); }
  metamorphose(from, to) { this.morph = { from, to, t: 0 }; this.species = to; }
  burst() {
    const t = this.track, col = t.colorIdx >= 0 && PAL[t.colorIdx] ? PAL[t.colorIdx].color : '#ffffff';
    for (let i = 0; i < 22; i++) {
      const a = rand(0, TAU), v = rand(40, 140);
      this.sparks.push({ x: this.x, y: this.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.5, 1.1), col: i % 3 ? col : '#fffbe0' });
    }
  }
  update(dt) {
    const t = this.track;
    this.t += dt;
    this.alpha = this.leaving ? this.alpha - dt * 1.4 : Math.min(1, this.alpha + dt * 2);
    const tx = (t.box.x + t.box.w / 2) * W, ty = clamp((t.box.y + t.box.h * 0.55) * H, 30, H - 30);
    if (!this.placed) this.place();
    const nx = lerp(this.x, tx, Math.min(1, dt * 5)), ny = lerp(this.y, ty, Math.min(1, dt * 5));
    const vx = (nx - this.x) / Math.max(dt, 1e-3), vy = (ny - this.y) / Math.max(dt, 1e-3);
    this.x = nx; this.y = ny;
    this.spd = lerp(this.spd, Math.hypot(vx, vy), 0.2);
    if (this.spd > 18) {
      let d = Math.atan2(vy, vx) - this.a; d = Math.atan2(Math.sin(d), Math.cos(d));
      this.a += clamp(d, -1, 1) * Math.min(1, dt * 6);
    } else this.a += Math.sin(this.t * 0.7) * dt * 0.25;
    const targetS = clamp(t.box.h * 70 * P.tamano, 14, 150);
    this.s = lerp(this.s, targetS, Math.min(1, dt * 2));
    this.walk += dt * (2 + this.spd * 0.06 + t.speed * 14);
    if (this.morph) { this.morph.t += dt; if (this.morph.t >= MORPH) this.morph = null; else if (Math.abs(this.morph.t - MORPH / 2) < dt) this.burst(); }
    const gap = this.s * 0.45 * 1.1;
    let px = this.x, py = this.y;
    for (const sg of this.segs) {
      const dx = sg.x - px, dy = sg.y - py, d = Math.hypot(dx, dy) || 1;
      if (d > gap) { sg.x = px + dx / d * gap; sg.y = py + dy / d * gap; }
      px = sg.x; py = sg.y;

    for (let i = this.sparks.length - 1; i >= 0; i--) {

}

/* ==================================================================

DRAW.mariposa = (c, s, av, sp) => {

DRAW.caracol = (c, s, av, sp) => {

  c.strokeStyle = P_.foot; c.lineWidth = Math.max(1, s * 0.1);

    const wob = Math.sin(av.t * 2 + sd) * s * 0.1;

DRAW.bolita = (c, s, av, sp) => {

DRAW.luciernaga = (c, s, av) => {

function glowOf(av) { return Math.pow(Math.max(0, Math.sin(av.t * 2.2)), 2); }

/* gusanos: se dibujan en coordenadas del mundo usando los segmentos */
function drawWorm(av, sp, s) {
  const P_ = sp.p, n = av.segs.length, lomb = sp === SPECIES.lombriz;
  const c = ctx; const scale = s / (av.s * sp.k || 1);
  const pts = av.segs.map(sg => ({ x: av.x + (sg.x - av.x) * scale, y: av.y + (sg.y - av.y) * scale }));
  c.save();
  c.shadowColor = 'rgba(0,0,0,0.55)'; c.shadowBlur = s * 0.9; c.shadowOffsetX = s * 0.15; c.shadowOffsetY = s * 0.35;
  c.fillStyle = 'rgba(0,0,0,0.45)';
  c.beginPath();
  for (let i = n - 1; i >= 0; i--) { const k = 1 - i / n * 0.45; c.moveTo(pts[i].x + s * k + 1.5, pts[i].y); c.arc(pts[i].x, pts[i].y, s * k + 1.5, 0, TAU); }
  c.moveTo(av.x + s * 1.05 + 1.5, av.y); c.arc(av.x, av.y, s * 1.05 + 1.5, 0, TAU);
  c.fill();
  c.restore();
  for (let i = n - 1; i >= 0; i--) {
    const k = 1 - i / n * 0.45;
    c.fillStyle = (lomb && (i === 3 || i === 4)) ? P_.band : (i % 2 ? P_.c1 : P_.c2);
    c.beginPath(); c.arc(pts[i].x, pts[i].y, s * k, 0, TAU); c.fill();
    if (P_.dot && i % 2 === 0) {
      c.fillStyle = P_.dot;
      for (const sd of [-1, 1]) {
        const nx = i > 0 ? pts[i - 1].x - pts[i].x : 0, ny = i > 0 ? pts[i - 1].y - pts[i].y : 1, d = Math.hypot(nx, ny) || 1;
        c.beginPath(); c.arc(pts[i].x - ny / d * sd * s * k * 0.5, pts[i].y + nx / d * sd * s * k * 0.5, s * 0.16, 0, TAU); c.fill();
      }
    }
  }
  c.fillStyle = P_.head; c.beginPath(); c.arc(av.x, av.y, s * 1.05, 0, TAU); c.fill();
  if (!lomb) {
    for (const sd of [-1, 1]) {
      const ex = av.x + Math.cos(av.a) * s * 0.45 + Math.cos(av.a + Math.PI / 2) * sd * s * 0.42;
      const ey = av.y + Math.sin(av.a) * s * 0.45 + Math.sin(av.a + Math.PI / 2) * sd * s * 0.42;
      c.fillStyle = '#fff'; c.beginPath(); c.arc(ex, ey, s * 0.22, 0, TAU); c.fill();
      c.fillStyle = '#111'; c.beginPath(); c.arc(ex + Math.cos(av.a) * s * 0.06, ey + Math.sin(av.a) * s * 0.06, s * 0.12, 0, TAU); c.fill();
    }
  }
}

/* el resto se dibuja en un lienzo aparte y se estampa con sombra, así resalta sobre el pasto */
const off = document.createElement('canvas'); const octx = off.getContext('2d');
function drawSpecies(av, key, scale, spin) {
  const sp = SPECIES[key]; if (!sp || scale <= 0.01) return;
  const s = av.s * sp.k * scale;
  if (sp.d === 'gusano') { ctx.save(); ctx.globalAlpha = clamp(av.alpha, 0, 1); drawWorm(av, sp, s); ctx.restore(); return; }
  const R = Math.ceil(s * 3.2) + 4;
  if (off.width < 2 * R) { off.width = 2 * R; off.height = 2 * R; }
  octx.setTransform(1, 0, 0, 1, 0, 0); octx.clearRect(0, 0, 2 * R, 2 * R);
  octx.setTransform(1, 0, 0, 1, R, R); octx.rotate(av.a + spin);
  DRAW[sp.d](octx, s, av, sp);
  const lift = sp.fly ? s * 0.55 + Math.sin(av.t * 3) * s * 0.15 : 0;
  ctx.save(); ctx.globalAlpha = clamp(av.alpha, 0, 1);
  ctx.shadowColor = sp.fly ? 'rgba(0,0,0,0.45)' : 'rgba(0,0,0,0.6)';
  ctx.shadowBlur = sp.fly ? s * 0.8 : s * 0.45;
  ctx.shadowOffsetX = sp.fly ? lift * 0.6 : s * 0.1; ctx.shadowOffsetY = sp.fly ? lift * 1.3 : s * 0.22;
  ctx.drawImage(off, 0, 0, 2 * R, 2 * R, av.x - R, av.y - R - lift * 0.3, 2 * R, 2 * R);
  ctx.restore();
}
const easeOutBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };

function glowAt(x, y, r, a) {
  const rg = ctx.createRadialGradient(x, y, 0, x, y, r);
  rg.addColorStop(0, `rgba(255,250,215,${a})`); rg.addColorStop(1, 'rgba(255,250,215,0)');
  ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
}
function drawAvatar(av) {
  if (!av.species) return;
  if (av.morph) {
    const k = av.morph.t / MORPH, g = Math.sin(k * Math.PI);
    if (k < 0.5) {
      if (av.morph.from) drawSpecies(av, av.morph.from, 1 - k * 2, k * 6);
      glowAt(av.x, av.y, av.s * 1.2 * g + 1, 0.85 * g);
    } else {
      glowAt(av.x, av.y, av.s * 1.2 * g + 1, 0.7 * g);
      drawSpecies(av, av.morph.to, easeOutBack((k - 0.5) * 2), -(1 - k) * 4);
    }
  } else drawSpecies(av, av.species, 1, 0);
  for (const p of av.sparks) {
    ctx.globalAlpha = clamp(p.life, 0, 1) * clamp(av.alpha, 0, 1);
    ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(p.x, p.y, 2.5, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function drawLabel(av) {
  if (!P.mostrar_nombres || !av.species || av.alpha < 0.1) return;
  const t = av.track, sp = SPECIES[av.species];
  const txt = sp.n, y = Math.max(16, av.y - av.s * 1.5 - 10);
  ctx.save(); ctx.globalAlpha = clamp(av.alpha, 0, 1);
  ctx.font = '600 14px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const w = ctx.measureText(txt).width + 26;
  ctx.fillStyle = 'rgba(12,16,8,0.75)';
  const x0 = clamp(av.x - w / 2, 4, W - w - 4);
  ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x0, y - 12, w, 24, 12); else ctx.rect(x0, y - 12, w, 24); ctx.fill();
  ctx.fillStyle = t.colorIdx >= 0 && PAL[t.colorIdx] ? PAL[t.colorIdx].color : '#999';
  ctx.beginPath(); ctx.arc(x0 + 12, y, 5, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.fillText(txt, x0 + w / 2 + 5, y + 0.5);
  ctx.restore();
}

/* ==================================================================
   FONDO: textura de pasto (foto) repetida

const ground = document.createElement('canvas'); ground.width = W; ground.height = H;
let flowers = [];
function paintGround() {
  const g = ground.getContext('2d');
  g.fillStyle = '#3d5a26'; g.fillRect(0, 0, W, H);
  if (PASTO.complete && PASTO.naturalWidth) {
    const tile = Math.max(64, Math.round(H * 0.75 * P.escala_pasto));
    const tc = document.createElement('canvas'); tc.width = tc.height = tile;
    tc.getContext('2d').drawImage(PASTO, 0, 0, tile, tile);
    g.fillStyle = g.createPattern(tc, 'repeat'); g.fillRect(0, 0, W, H);
  }
  // variaciones suaves de luz para disimular la repetición
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 16; i++) {
    const x = rnd() * W, y = rnd() * H, r = 120 + rnd() * 260, light = rnd() > 0.5;
    const rg = g.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, light ? 'rgba(255,255,200,0.07)' : 'rgba(0,20,0,0.14)'); rg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = rg; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  }
}
function makeFlowers() {
  const palette = [[350, 80, 62], [45, 95, 60], [280, 55, 70], [200, 70, 75], [0, 0, 97], [20, 90, 60]];
  flowers = [];
  for (let i = 0; i < P.flores; i++) {
    const c = pick(palette);
    flowers.push({ x: rand(40, W - 40), y: rand(40, H - 40), h: c[0], s: c[1], l: c[2], n: pick([5, 6, 8]), r: rand(9, 14), rot: rand(0, TAU) });
  }
}
PASTO.onload = paintGround;
function drawFlower(f) {
  ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.rot + Math.sin(time * 1.2 + f.x) * 0.05);
  ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 6; ctx.shadowOffsetY = 3;
  ctx.fillStyle = `hsl(${f.h},${f.s}%,${f.l}%)`;
  for (let i = 0; i < f.n; i++) { ctx.save(); ctx.rotate(i * TAU / f.n); ctx.beginPath(); ctx.ellipse(f.r * 0.65, 0, f.r * 0.6, f.r * 0.32, 0, 0, TAU); ctx.fill(); ctx.restore(); }
  ctx.shadowColor = 'transparent';
  ctx.fillStyle = '#f2b51d'; ctx.beginPath(); ctx.arc(0, 0, f.r * 0.28, 0, TAU); ctx.fill();
  ctx.restore();
}

function render() {
  ctx.drawImage(ground, 0, 0);
  for (const f of flowers) drawFlower(f);
  if (P.mostrar_sombra && mode === 'fondo' && bgModel && camOk && !demo) {
    ctx.save(); ctx.globalAlpha = 0.9; ctx.drawImage(shadowCv, 0, 0, W, H); ctx.restore();
  }
  const avs = tracks.map(t => t.avatar);
  const order = av => (av.species && SPECIES[av.species].fly ? 1 : 0);
  avs.sort((a, b) => order(a) - order(b) || a.y - b.y);
  for (const av of avs) drawAvatar(av);
  if (night > 0.02) { ctx.fillStyle = `rgba(8,14,40,${night * 0.7})`; ctx.fillRect(0, 0, W, H); }
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const av of avs) if (av.species === 'luciernaga' && !av.morph) {
    const g = glowOf(av) * (0.3 + 0.7 * night) * clamp(av.alpha, 0, 1); if (g < 0.02) continue;
    const r = av.s * (0.6 + 1.4 * g);
    const rg = ctx.createRadialGradient(av.x, av.y, 0, av.x, av.y, r);
    rg.addColorStop(0, `rgba(220,255,120,${0.85 * g})`); rg.addColorStop(1, 'rgba(220,255,120,0)');
    ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(av.x, av.y, r, 0, TAU); ctx.fill();
  }
  ctx.restore();
  for (const av of avs) drawLabel(av);
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, Math.max(W, H) * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.32)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  if (!avs.some(a => !a.leaving)) {
    ctx.save(); ctx.font = '600 22px system-ui, sans-serif'; ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(0,0,0,.7)'; ctx.shadowBlur = 8;
    ctx.fillStyle = `rgba(255,255,255,${0.6 + 0.25 * Math.sin(time * 2)})`;
    ctx.fillText(demo ? 'Mové el mouse sobre el jardín' : 'Entrá en cuadro para convertirte en bicho', W / 2, H / 2);
    ctx.restore();
  }
}

let menuOpen = false, idleTimer = null, toastTimer = null;
function setMenu(open) {
  menuOpen = open; stage.classList.toggle('menu', open);
  if (!open) { pickRow = -1; renderEditorState(); }
  wake();
}
function wake() {
  stage.classList.remove('idle'); clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (!menuOpen) stage.classList.add('idle'); }, 2500);
}
stage.addEventListener('pointermove', wake);
stage.addEventListener('pointerdown', wake);
$('eco-gear').onclick = () => setMenu(true);
$('eco-close').onclick = () => setMenu(false);
document.addEventListener('keydown', e => {
  const tag = (e.target && e.target.tagName) || '';
  if (/INPUT|SELECT|TEXTAREA/.test(tag)) return;
  if (e.key === 'm' || e.key === 'M') { setMenu(!menuOpen); e.preventDefault(); }
  else if (e.key === 'Escape' && menuOpen) setMenu(false);
  else if (e.key === 'f' || e.key === 'F') toggleFull();
  else if (demo && demoTrack && e.key >= '1' && e.key <= '9') { const k = +e.key - 1; if (k < PAL.length) demoTrack.forceColor = k; }
});
stage.querySelectorAll('.eco-tabs button').forEach(b => b.onclick = () => {
  stage.querySelectorAll('.eco-tabs button').forEach(x => x.classList.toggle('on', x === b));
  stage.querySelectorAll('.eco-sec').forEach(s => s.classList.toggle('on', s.dataset.sec === b.dataset.tab));
});
function setStatus(s, toast) {
  statusEl.textContent = s;
  if (toast && !menuOpen) { toastEl.textContent = s; toastEl.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), 4500); }
}
let flashTimer = null;
function flash(txt, ms) { bigEl.textContent = txt; clearTimeout(flashTimer); if (ms) flashTimer = setTimeout(() => bigEl.textContent = '', ms); }

/* Sliders */
const sliderEls = {};
SLIDERS.forEach(sd => {
  const wrap = document.createElement('label'); wrap.className = 'eco-slider';
  wrap.innerHTML = `<span>${sd.label}</span><output></output><input type="range" min="${sd.min}" max="${sd.max}" step="${sd.step}">`;
  const inp = wrap.querySelector('input'), out = wrap.querySelector('output');
  inp.value = P[sd.id]; out.textContent = sd.fmt(P[sd.id]);
  inp.addEventListener('input', () => {
    P[sd.id] = +inp.value; out.textContent = sd.fmt(P[sd.id]);
    if (sd.id === 'lim_medio' && P.lim_rapido < P.lim_medio + 0.05) setSlider('lim_rapido', Math.min(1, P.lim_medio + 0.05));
    if (sd.id === 'lim_rapido' && P.lim_medio > P.lim_rapido - 0.05) setSlider('lim_medio', Math.max(0.05, P.lim_rapido - 0.05));
    if (sd.id === 'tolerancia') buildLUT();
    if (sd.id === 'escala_pasto') paintGround();
    if (sd.id === 'flores') makeFlowers();
    scheduleSave();
  });
  sliderEls[sd.id] = { wrap, inp, out, sd };
  $('eco-sliders-' + sd.g).appendChild(wrap);
});
function setSlider(id, v) { const s = sliderEls[id]; P[id] = v; s.inp.value = v; s.out.textContent = s.sd.fmt(v); }
const FLAG_IDS = { mostrar_nombres: 'eco-chk-names', mostrar_sombra: 'eco-chk-shadow', noche: 'eco-chk-night', espejo: 'eco-chk-mirror' };
for (const f of FLAGS) { const el = $(FLAG_IDS[f]); el.checked = P[f]; el.onchange = () => { P[f] = el.checked; if (f === 'espejo') resetVision('Cambió el espejado'); scheduleSave(); }; }

/* Editor de colores y bichos */
const editorEl = $('eco-editor');
let pickRow = -1;
function speciesOptions(sel) {
  const groups = {};
  Object.keys(SPECIES).forEach(k => (groups[GRUPO(k)] = groups[GRUPO(k)] || []).push(k));
  return ['Se arrastran', 'Caminan', 'Vuelan'].map(g => `<optgroup label="${g}">` +
    groups[g].sort((a, b) => SPECIES[a].n.localeCompare(SPECIES[b].n)).map(k => `<option value="${k}"${k === sel ? ' selected' : ''}>${SPECIES[k].n}</option>`).join('') +
    '</optgroup>').join('');
}
function renderEditor() {
  editorEl.innerHTML = PAL.map((r, i) => `
    <div class="eco-row" data-i="${i}">
      <div class="eco-rh">
        <input type="color" value="${r.color}" title="Tono de la ropa">
        <input type="text" value="${esc(r.nombre)}" maxlength="30" title="Nombre">
        <button class="eco-pick" title="Tomar el color de la cámara">📷</button>
        <button class="eco-del" title="Quitar este color"${PAL.length <= 1 ? ' disabled' : ''}>×</button>
      </div>
      <div class="eco-sel3">${[0, 1, 2].map(l => `<span>${NIVEL_ICON[l]}</span><select data-l="${l}">${speciesOptions(r.e[l])}</select>`).join('')}</div>
    </div>`).join('');
  editorEl.querySelectorAll('.eco-row').forEach(row => {
    const i = +row.dataset.i;
    row.querySelector('input[type=color]').addEventListener('input', e => { PAL[i].color = e.target.value; paletteChanged(); });
    row.querySelector('input[type=text]').addEventListener('input', e => { PAL[i].nombre = e.target.value || 'Color'; scheduleSave(); });
    row.querySelector('.eco-pick').onclick = () => {
      pickRow = pickRow === i ? -1 : i; renderEditorState();
      if (pickRow >= 0) {
        setStatus(camOk && !demo ? 'Hacé clic sobre la ropa de “' + PAL[i].nombre + '” en la vista de cámara.' : 'Necesitás la cámara activa para tomar un color.');
        stage.querySelector('.eco-scroll').scrollTo({ top: 0, behavior: 'smooth' });
      }
    };
    row.querySelector('.eco-del').onclick = () => { if (PAL.length > 1) { PAL.splice(i, 1); pickRow = -1; paletteChanged(); renderEditor(); } };
    row.querySelectorAll('select').forEach(s => s.onchange = () => { PAL[i].e[+s.dataset.l] = s.value; scheduleSave(); });
    row.addEventListener('click', e => {
      if (demo && demoTrack && !e.target.closest('input,select,button')) demoTrack.forceColor = i;
    });
  });
  renderEditorState();
}
function renderEditorState() {
  editorEl.querySelectorAll('.eco-pick').forEach((b, i) => b.classList.toggle('armed', i === pickRow));
  pv.classList.toggle('picking', pickRow >= 0);
}
$('eco-add').onclick = () => {
  if (PAL.length >= 20) return;
  PAL.push({ nombre: 'Color nuevo', color: '#808080', e: ['caracol', 'hormiga', 'mariposa_violeta'] });
  paletteChanged(); renderEditor();
  pickRow = PAL.length - 1; renderEditorState();
  stage.querySelector('.eco-scroll').scrollTo({ top: 0, behavior: 'smooth' });
  setStatus('Color agregado al final de la lista: hacé clic sobre la ropa en la vista de cámara, o elegí el tono con el selector.');
};
$('eco-reset').onclick = () => { PAL = clone(DEFAULT_PAL); pickRow = -1; paletteChanged(); renderEditor(); };
$('eco-dl').onclick = () => {
  const blob = new Blob([JSON.stringify(configObject(), null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'ecosistema_config.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};
$('eco-ul').onclick = () => $('eco-file').click();
$('eco-file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const o = JSON.parse(await f.text()); const pal = validPal(o.paleta);
    if (!pal) throw new Error('sin paleta');
    PAL = pal;
    if (o.parametros) {
      for (const sd of SLIDERS) { const v = +o.parametros[sd.id]; if (isFinite(v)) setSlider(sd.id, clamp(v, sd.min, sd.max)); }
      for (const fl of FLAGS) if (typeof o.parametros[fl] === 'boolean') { P[fl] = o.parametros[fl]; $(FLAG_IDS[fl]).checked = P[fl]; }
    }
    paletteChanged(); renderEditor(); paintGround(); makeFlowers();
    setStatus('Configuración cargada.');
  } catch (err) { setStatus('Ese archivo no es una configuración válida.'); }
  e.target.value = '';
};
/* cuentagotas: clic en la vista de cámara */
pv.addEventListener('click', e => {
  if (pickRow < 0 || !pix) return;
  const r = pv.getBoundingClientRect();
  const x = Math.floor((e.clientX - r.left) / r.width * AW), y = Math.floor((e.clientY - r.top) / r.height * AH);
  let sr = 0, sg = 0, sb = 0, n = 0;
  for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
    const xx = clamp(x + dx, 0, AW - 1), yy = clamp(y + dy, 0, AH - 1), p = (yy * AW + xx) * 4;
    sr += pix[p]; sg += pix[p + 1]; sb += pix[p + 2]; n++;
  }
  PAL[pickRow].color = rgbToHex(sr / n, sg / n, sb / n);
  setStatus('Color tomado para “' + PAL[pickRow].nombre + '”.');
  const done = pickRow; pickRow = -1; paletteChanged(); renderEditor();
  const row = editorEl.children[done]; if (row) row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
});

/* Panel: vista previa y personas */
const peopleEl = $('eco-people'), countEl = $('eco-count');
function renderPanel() {
  pctx.fillStyle = '#000'; pctx.fillRect(0, 0, pv.width, pv.height);
  if (camOk && !demo) {
    pctx.save(); if (P.espejo) { pctx.translate(pv.width, 0); pctx.scale(-1, 1); }
    pctx.drawImage(video, 0, 0, pv.width, pv.height); pctx.restore();
    if (mode === 'fondo' && bgModel) { pctx.globalAlpha = 0.5; pctx.drawImage(shadowCv, 0, 0, pv.width, pv.height); pctx.globalAlpha = 1; }
  } else {
    pctx.fillStyle = '#a9b78f'; pctx.font = '13px system-ui'; pctx.textAlign = 'center';
    pctx.fillText('Modo demo', pv.width / 2, pv.height / 2 - 8);
    pctx.fillText('mouse = persona · teclas 1–9 = color', pv.width / 2, pv.height / 2 + 10);
  }
  for (const t of tracks) {
    if (t.avatar.leaving || t.demo) continue;
    const col = t.colorIdx >= 0 && PAL[t.colorIdx] ? PAL[t.colorIdx].color : '#ffffff';
    const x = t.box.x * pv.width, y = t.box.y * pv.height, w = t.box.w * pv.width, h = t.box.h * pv.height;
    pctx.strokeStyle = col; pctx.lineWidth = 2; pctx.strokeRect(x, y, w, h);
    pctx.setLineDash([3, 3]); pctx.strokeStyle = 'rgba(255,255,255,.6)'; pctx.lineWidth = 1;
    pctx.strokeRect(x + w * 0.25, y + h * 0.22, w * 0.5, h * 0.4); pctx.setLineDash([]);
    pctx.fillStyle = 'rgba(0,0,0,.65)'; pctx.fillRect(x, y, 22, 16);
    pctx.fillStyle = '#fff'; pctx.font = '600 11px system-ui'; pctx.textAlign = 'left'; pctx.fillText('#' + t.id, x + 3, y + 12);
  }
  const live = tracks.filter(t => !t.avatar.leaving);
  countEl.textContent = live.length + (live.length === 1 ? ' persona · 1 bicho' : ` personas · ${live.length} bichos`);
  if (!live.length) peopleEl.innerHTML = '<div class="eco-empty">Nadie en cuadro todavía.</div>';
  else peopleEl.innerHTML = live.map(t => {
    const sp = t.species ? SPECIES[t.species].n : '…';
    const col = t.colorIdx >= 0 ? PAL[t.colorIdx] : null;
    const pend = t.pending ? ` <span style="color:#f2c94c">→ ${SPECIES[t.pending].n}</span>` : '';
    return `<div class="eco-person"><span class="eco-sw" style="background:${col ? col.color : '#555'}"></span>
      <div><b>${t.demo ? 'Demo' : '#' + t.id}</b> · ${sp}${pend}<div class="eco-sub">${col ? esc(col.nombre) : 'midiendo color'} · ${NIVELES[t.level]} (${t.speed.toFixed(2)})</div></div>
      <div class="eco-speed"><i style="width:${(t.speed * 100).toFixed(0)}%"></i><b style="left:${P.lim_medio * 100}%"></b><b style="left:${P.lim_rapido * 100}%"></b></div></div>`;
  }).join('');
  const rows = editorEl.children;
  const on = new Map(); live.forEach(t => { if (t.colorIdx >= 0) on.set(t.colorIdx, (on.get(t.colorIdx) || new Set()).add(t.level)); });
  for (let i = 0; i < rows.length; i++) {
    rows[i].classList.toggle('on', on.has(i));
    rows[i].querySelectorAll('select').forEach(s => s.classList.toggle('on', on.has(i) && on.get(i).has(+s.dataset.l)));
  }
}
function refreshModeUI() {
  $('eco-mode').textContent = demo ? 'modo demo' : (mode === 'ia' ? 'detector IA' : 'detector por fondo');
  sliderEls.confianza.wrap.classList.toggle('off', mode !== 'ia');
  sliderEls.umbral_fondo.wrap.classList.toggle('off', mode !== 'fondo');
}

/* registro hacia Python (Colab) */
let logTimer = 0;
function logToPython(dt) {
  if (!CFG.registrar) return;
  logTimer -= dt; if (logTimer > 0) return; logTimer = 2;
  try {
    const live = tracks.filter(t => !t.avatar.leaving && t.species && PAL[t.colorIdx]);
    const esp = {}; live.forEach(t => { const n = SPECIES[t.species].n; esp[n] = (esp[n] || 0) + 1; });
    const payload = JSON.stringify({
      t: +time.toFixed(1), personas: live.length, especies: esp,
      velocidades: live.map(t => +t.speed.toFixed(3)), colores: live.map(t => PAL[t.colorIdx].nombre),
      niveles: live.map(t => NIVELES[t.level]), noche: +night.toFixed(2)
    });
    google.colab.kernel.invokeFunction('eco.registrar', [payload], {});
  } catch (e) { CFG.registrar = false; }
}

/* ==================================================================
   CONTROLES Y MODO DEMO
   ================================================================== */
let mouse = { x: W / 2, y: H / 2, speed: 0, inside: false }, lastMouse = null;
cv.addEventListener('pointermove', e => {
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H, now = performance.now();
  if (lastMouse) { const dt = Math.max(1, now - lastMouse.t) / 1000; mouse.speed = Math.max(mouse.speed * 0.6, Math.hypot(x - lastMouse.x, y - lastMouse.y) / dt); }
  mouse.x = x; mouse.y = y; mouse.inside = true; lastMouse = { x, y, t: now };
});
cv.addEventListener('pointerleave', () => { lastMouse = null; mouse.inside = false; });
function demoStep(dt) {
  if (!demoTrack) {
    demoTrack = newTrack({ x: 0.45, y: 0.3, w: 0.1, h: 0.45 }); demoTrack.demo = true;
    demoTrack.demoColor = 0; demoTrack.demoSpeed = 0; demoTrack.colorT = 0; demoTrack.forceColor = null;
    tracks.push(demoTrack);
  }
  const t = demoTrack;
  const tx = mouse.inside ? mouse.x / W : 0.5 + Math.cos(time * 0.3) * 0.25;
  const ty = mouse.inside ? mouse.y / H : 0.5 + Math.sin(time * 0.45) * 0.2;
  t.box.x = tx - t.box.w / 2; t.box.y = ty - t.box.h * 0.55; t.cx = tx; t.cy = ty;
  mouse.speed *= Math.pow(0.05, dt);
  t.demoSpeed = clamp(mouse.speed / 1400, 0, 1);
  if (t.forceColor != null) { t.demoColor = t.forceColor; t.forceColor = null; t.colorT = 0; }
  t.colorT += dt; if (t.colorT > 10) { t.colorT = 0; t.demoColor = (t.demoColor + 1) % PAL.length; }
  night += ((nightForce ? 1 : 0) - night) * 0.03;
}

$('eco-btn-cal').onclick = () => {
  if (!camOk) { setStatus('No hay cámara activa.'); return; }
  setMenu(false);
  let n = 3; flash('Salí del cuadro… ' + n);
  const iv = setInterval(() => {
    n--;
    if (n > 0) flash('Salí del cuadro… ' + n);
    else { clearInterval(iv); flash('Guardando fondo…'); bgAccum = new Float32Array(AW * AH * 3); bgFrames = 0; calibrating = true; }
  }, 1000);
};
$('eco-btn-mode').onclick = () => {
  tracks = []; demoTrack = null; lastAssoc = 0;
  if (mode === 'ia') { mode = 'fondo'; setStatus(bgModel ? 'Detector por fondo.' : 'Detector por fondo: tocá “Calibrar fondo” con el cuadro vacío.'); }
  else { mode = 'ia'; if (aiState !== 'ready') { aiState = 'idle'; loadAI(); } else setStatus('Detector IA.'); }
  refreshModeUI();
};
$('eco-btn-night').onclick = e => { nightForce = !nightForce; e.target.textContent = nightForce ? 'Noche automática' : 'Forzar noche'; };
$('eco-btn-demo').onclick = e => {
  demo = !demo; tracks = []; demoTrack = null; e.target.textContent = demo ? 'Usar cámara' : 'Modo demo';
  setStatus(demo ? 'Modo demo: el mouse es una persona. Movelo rápido o lento; las teclas 1–9 o un clic en una fila cambian el color.' : (camOk ? 'Cámara activa.' : 'Sin cámara.'));
  if (!demo && !camOk) startCamera();
  refreshModeUI();
};
function toggleFull() {
  const doc = document;
  if (doc.fullscreenElement || doc.webkitFullscreenElement) { (doc.exitFullscreen || doc.webkitExitFullscreen).call(doc); return; }
  const req = stage.requestFullscreen || stage.webkitRequestFullscreen;
  if (req) Promise.resolve(req.call(stage)).catch(() => setStatus('El navegador no permitió pantalla completa aquí. Exportá el HTML y abrilo directamente.', true));
}
$('eco-btn-full').onclick = toggleFull;

/* ---- cámaras: elegir entre varias ---- */
const camSel = $('eco-cam');
let camDevices = [], camCurrent = null, firstStart = true;
function camName(d, i) { return d.label || ('Cámara ' + (i + 1)); }
async function listCameras() {
  try {
    const devs = await navigator.mediaDevices.enumerateDevices();
    camDevices = devs.filter(d => d.kind === 'videoinput');
  } catch (e) { camDevices = []; }
  if (!camDevices.length) { camSel.innerHTML = '<option>No se encontró ninguna cámara</option>'; camSel.disabled = true; return; }
  camSel.disabled = false;
  camSel.innerHTML = camDevices.map((d, i) => `<option value="${esc(d.deviceId)}">${esc(camName(d, i))}</option>`).join('');
  if (camCurrent) camSel.value = camCurrent;
}
function stopStream() { if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; }
function resetVision(why) {
  hasPrev = false; bgModel = null; calibrating = false; pix = null; tracks = []; demoTrack = null; lastAssoc = 0;
  if (mode === 'fondo' && camOk && !demo) setStatus(why + ': calibrá el fondo de nuevo (menú → Detección).', true);
}
/* busca la cámara preferida: la elegida en el menú (id o nombre) o la del notebook (número o parte del nombre) */
function preferredDevice() {
  if (camPref) {
    const byId = camDevices.find(d => d.deviceId && d.deviceId === camPref.id);
    if (byId) return byId;
    const byLabel = camPref.label && camDevices.find(d => d.label === camPref.label);
    if (byLabel) return byLabel;
  }
  const want = String(CFG.camara || '').trim();
  if (want) {
    const n = parseInt(want, 10);
    if (String(n) === want && camDevices[n - 1]) return camDevices[n - 1];
    const byText = camDevices.find(d => d.label.toLowerCase().includes(want.toLowerCase()));
    if (byText) return byText;
  }
  return null;
}
async function startCamera(deviceId) {
  stopStream();
  const video_c = { width: 640, height: 480 };
  if (deviceId) video_c.deviceId = { exact: deviceId };
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: video_c, audio: false });
    video.srcObject = stream; await video.play();
    camOk = true; demo = false;
    const tr = stream.getVideoTracks()[0];
    camCurrent = (tr.getSettings && tr.getSettings().deviceId) || deviceId || null;
    await listCameras();
    if (firstStart) {
      firstStart = false;
      const pref = preferredDevice();
      if (pref && pref.deviceId && pref.deviceId !== camCurrent) return startCamera(pref.deviceId);
    }
    const idx = camDevices.findIndex(d => d.deviceId === camCurrent);
    const nombre = idx >= 0 ? camName(camDevices[idx], idx) : 'cámara';
    if (mode === 'ia') { if (aiState === 'ready') setStatus('Usando ' + nombre + '.', true); else loadAI(); }
    else setStatus('Usando ' + nombre + '. Abrí el menú (M) y tocá “Calibrar fondo” con el cuadro vacío.', true);
  } catch (err) {
    if (deviceId) {   // la cámara elegida no está: volver a la predeterminada
      setStatus('No se pudo abrir esa cámara (' + (err && err.name || 'error') + '). Uso la predeterminada.', true);
      return startCamera(null);
    }
    camOk = false; demo = true;
    setStatus('Sin cámara (' + (err && err.name || 'error') + '). Modo demo: el mouse es una persona.', true);
    listCameras();
  }
  refreshModeUI();
}
camSel.onchange = async () => {
  const id = camSel.value, i = camDevices.findIndex(d => d.deviceId === id);
  camPref = { id, label: i >= 0 ? camDevices[i].label : '' };
  scheduleSave();
  resetVision('Cambiaste de cámara');
  if (demo) { demo = false; $('eco-btn-demo').textContent = 'Modo demo'; }
  await startCamera(id);
};
if (navigator.mediaDevices && navigator.mediaDevices.addEventListener)
  navigator.mediaDevices.addEventListener('devicechange', () => {
    listCameras().then(() => {
      if (camOk && camCurrent && !camDevices.some(d => d.deviceId === camCurrent)) {
        setStatus('Se desconectó la cámara: paso a la predeterminada.', true); resetVision('Cambió la cámara'); startCamera(null);
      } else setStatus('Cambió la lista de cámaras: ' + camDevices.length + ' disponible' + (camDevices.length === 1 ? '' : 's') + '.', true);
    });
  });

/* ==================================================================
   BUCLE PRINCIPAL
   ================================================================== */
buildLUT(); paintGround(); makeFlowers(); renderEditor(); refreshModeUI(); wake();
$('eco-saved').textContent = saved ? 'Se cargó la configuración guardada.' : '';
setTimeout(() => { if (!menuOpen && !toastEl.classList.contains('show')) setStatus('Apretá M o tocá ⚙ para abrir el menú.', true); }, 600);
let last = performance.now();
function loop(now) {
  if (!document.body.contains(cv)) { stopStream(); return; }
  const dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt;
  if (demo) demoStep(dt);
  else if (camOk && video.readyState >= 2 && frame % 2 === 0) {
    analyze();
    if (mode === 'ia') { aiDetect(); if (aiDets) { associate(aiDets); aiDets = null; } }
    else associate(blobDetect());
  }
  for (const t of tracks) { if (!t.avatar.leaving) measure(t, dt); t.avatar.update(dt); }
  tracks = tracks.filter(t => !t.avatar.dead);
  render();
  if (menuOpen && frame % 5 === 0) renderPanel();
  logToPython(dt);
  frame++;
  requestAnimationFrame(loop);
}
startCamera();
requestAnimationFrame(loop);
})();
</script>
